# Plasma Horos still, installed from branding/wallpapers/default.png
# to /usr/share/backgrounds/codalinux/default.png. See
# branding/wallpapers/README.md for attribution.
# hyprpaper 0.8+ dropped preload / wallpaper= lines; use wallpaper { }.
# monitor must be the first key (hyprlang is order-sensitive).
# Use monitor = * for all outputs. Empty monitor = is dropped by
# hyprlang special-category keys, so no wallpaper is registered.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/

splash = false

wallpaper {
    monitor = *
    path = /usr/share/backgrounds/codalinux/default.png
    fit_mode = cover
}
