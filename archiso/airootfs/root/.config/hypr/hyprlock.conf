# CodaLinux hyprlock — same Horos still as hyprpaper.
# Always start via coda-hyprlock so this file is used.
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# If hyprlock dies on a VM: Hyprland shows “Oopsie daisy…”. Recover with
#   hyprctl --instance 0 eval 'hl.clear_crashed_lockscreen()'
#   killall -9 hyprlock

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    disable_loading_bar = true
}

background {
    path = /usr/share/backgrounds/codalinux/default.png
    color = rgba(18, 22, 28, 1.0)
    blur_passes = 0
    blur_size = 0
}

input-field {
    monitor =
    size = 280, 48
    placeholder_text = <i>CodaLinux</i>
}
