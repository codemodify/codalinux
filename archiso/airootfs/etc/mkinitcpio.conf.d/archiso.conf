# Live ISO initramfs. PXE hooks omitted on purpose (local USB/optical only).
# memdisk omitted: it needs memdiskfind from syslinux, which we do not ship (UEFI-only).
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
