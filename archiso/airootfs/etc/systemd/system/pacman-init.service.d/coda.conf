[Unit]
# Live greeter (greetd → coda-hyprland) must not wait for pacman-key.
# Stock archiso WantedBy=multi-user.target pulled this oneshot onto the
# graphical critical path. Timer + After=graphical.target keeps the job
# in the background. Do not remove pacman-init — install/pacman need it.
After=graphical.target
Before=archlinux-keyring-wkd-sync.service
