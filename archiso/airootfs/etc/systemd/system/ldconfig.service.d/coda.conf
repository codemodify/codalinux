[Unit]
# Stock ldconfig.service runs when ConditionNeedsUpdate=/etc is true
# (OR of conditions). Live overlay boots have no /etc/.updated, or /usr
# looks newer than /etc, so this oneshot rebuilds the linker cache for
# ~30s on sysinit — before greetd. The squashfs already has
# /etc/ld.so.cache from mkarchiso/glibc hooks. Reset the first-boot
# condition so ldconfig only runs if the cache file is missing/empty.
ConditionNeedsUpdate=
