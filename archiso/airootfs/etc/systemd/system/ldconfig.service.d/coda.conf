[Unit]
# Stock Arch ldconfig.service (glibc):
#   ConditionNeedsUpdate=|/etc
#   ConditionFileNotEmpty=|!/etc/ld.so.cache
# The `|` prefix makes those triggering conditions (OR). Live overlay
# boots have a squashfs cache but no /etc/.updated, so NeedsUpdate is
# always true and sysinit rebuilds the linker cache (~30s) before greetd.
#
# systemd.unit(5): assigning the empty string to any Condition* resets
# the list completely — all previous conditions of any kind are dropped.
# 5fa4b9e only set ConditionNeedsUpdate=, which wiped the FileNotEmpty
# check and left the unit with no conditions. No conditions → always
# start (measured: ConditionResult=yes, ldconfig +31s with cache present).
#
# After that reset, add a single required (no `|`) inverted FileNotEmpty:
# start only if /etc/ld.so.cache is missing or empty. A non-empty cache
# skips the unit. Do not re-add NeedsUpdate.
ConditionNeedsUpdate=
ConditionFileNotEmpty=!/etc/ld.so.cache
