# Live ISO: autologin the dedicated `live` user into Hyprland.
# Both sessions use the wrapper so a crash retries the GUI (no agreety).
# Root on tty1 was fragile (Hyprland exits immediately; PAM session ~1s).

[terminal]
vt = 1

[default_session]
command = "/usr/local/bin/coda-hyprland"
user = "live"

[initial_session]
command = "/usr/local/bin/coda-hyprland"
user = "live"
