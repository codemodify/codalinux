# Live ISO: autologin the dedicated `live` user into Hyprland.
# Both sessions run coda-hyprland, which sets VirtualBox-safe env and
# execs start-hyprland (not the bare Hyprland binary). A crash retries
# the GUI (no agreety). Root on tty1 was fragile (PAM session ~1s).

[terminal]
vt = 1

[default_session]
command = "/usr/local/bin/coda-hyprland"
user = "live"

[initial_session]
command = "/usr/local/bin/coda-hyprland"
user = "live"
