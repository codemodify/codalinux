# Live-session hypridle. Do not auto-lock: hyprlock dies under
# VirtualBox/pixman and Hyprland then shows the crashed-lockscreen UI.
# Super+L / the AGS Lock tile still run coda-hyprlock.
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || coda-hyprlock
    ignore_dbus_inhibit = false
}

# No timeout listeners (no idle lock, no DPMS off).
