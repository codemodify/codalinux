# Stub boot entry. Replace identifiers with those your archiso version
# documents (releng uses %ARCHISO_LABEL%, %INSTALL_DIR%, %ARCH%, …).
title    CodaLinux (x86_64, linux)
sort-key 01
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/amd-ucode.img
initrd   /%INSTALL_DIR%/boot/%ARCH%/intel-ucode.img
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%
