# CodaLinux Hyprland stub — replace with the real shell integration.
# Docs: https://wiki.hypr.land/

monitor=,preferred,auto,1

env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = hyprpaper
exec-once = hypridle
# TODO: exec-once the AGS/Astal shell once desktop/ags/ is implemented
# exec-once = ags run /usr/local/share/codalinux/ags

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    # Theme placeholder — see branding/themes/README.md
    col.active_border = rgba(7fb4c8ee)
    col.inactive_border = rgba(595959aa)
}

decoration {
    rounding = 8
}

animations {
    enabled = yes
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

bind = SUPER, Return, exec, foot
bind = SUPER, Q, killactive,
bind = SUPER, E, exec, thunar
bind = SUPER, F, exec, firefox
bind = SUPER, L, exec, hyprlock
bind = SUPER, D, exec, foot
# TODO: SUPER, D → AGS launcher

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
