name: Check package lists

# Scaffold CI only — does not build an ISO.
on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unofficial / forbidden package names
        run: ./scripts/check-package-lists.sh
      - name: Wrapper executable bits and profiledef 755
        run: ./scripts/check-wrapper-modes.sh
      - name: Recompose lists (must be committed)
        run: |
          ./scripts/compose-package-lists.sh
          git diff --exit-code -- archiso/packages.x86_64 install/packages.txt install/user_configuration.json
